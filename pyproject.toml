[project]
name = "Fastapi-Mailman"
version = "0.0.4"
description = "Porting Django's email implementation to your FastAPI applications."
authors = [{ name = "Aniket Sarkar", email = "aniketsarkar@yahoo.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fastapi", "mail", "smtp", "fastapi-mail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Communications :: Email",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0",
    "Jinja2~=3.0",
    "aiosmtplib>=5.1.3",
    "pydantic~=2.0",
    "pydantic_settings~=2.0",
    "email-validator~=2.0",
    "dnspython~=2.0",
]

[project.urls]
Repository = "https://github.com/marktennyson/fastapi-mailman"

[project.optional-dependencies]
test = ["pytest", "black", "isort", "flake8", "pytest-cov", "anyio", "trio"]
dev = ["tox", "pre-commit", "virtualenv", "pip", "twine", "toml", "bump2version"]
doc = [
    "mkdocs",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocs-material-extensions",
    "mkdocs-autorefs",
]

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true
# you can skip files as below
#skip_glob = docs/conf.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_mailman"]
