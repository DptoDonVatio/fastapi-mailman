[tox]
isolated_build = true
envlist = py311, py312, py313, format, lint, build
skip_missing_interpreters = true

[gh-actions]
python =
    3.13: py313
    3.12: py312, format, lint, build
    3.11: py311

[testenv]
allowlist_externals = pytest
extras =
    test
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
; commands =
;     pytest -s --cov=fastapi_mailman --cov-append --cov-report=xml --cov-report term-missing tests
commands =
    pytest -s tests

; [testenv:format]
; allowlist_externals =
;     isort
;     black
; extras =
;     test
; commands =
;     isort fastapi_mailman
;     black fastapi_mailman tests

; [testenv:lint]
; allowlist_externals =
;     flake8
; extras =
;     test
; commands =
;     flake8 fastapi_mailman tests

; [testenv:build]
; allowlist_externals =
;     poetry
;     mkdocs
;     twine
; extras =
;     doc
;     dev
; commands =
;     poetry build
;     mkdocs build
;     twine check dist/*
